[project]
name = "photoflow"
version = "0.1.0"
description = "Ingest, derive and browse photos from a camera card"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shareef Jalloq" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/sjalloq/photoflow"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
photoflow = "photoflow.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["photoflow"]
include-package-data = true

[tool.setuptools.package-data]
photoflow = ["static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
